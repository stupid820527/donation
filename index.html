<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f2f2">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="聖義堂記帳">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="聖義堂班長的記帳 App — 出遊記帳、保險名單、普渡登記">
<title>聖義堂班長的記帳 App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Lora:wght@400;500&family=Noto+Serif+TC:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#f3f2f2; --surface:#eae9e9; --paper:#fbfaf9; --text:#201f1d;
  --n600:#7d7979; --n500:#9b9797; --n400:#bab6b6; --n300:#d7d3d3; --n700:#605d5d; --n800:#444141;
  --accent:#b68235; --accent-400:#e1ad66; --accent-700:#7d5411; --danger:#8a3d2c;
  --divider:rgba(32,31,29,.16); --hair:rgba(32,31,29,.1);
  --serif:"Noto Serif TC","Lora",serif; --display:"Cormorant Garamond","Noto Serif TC",serif; --num:"Lora",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--serif); font-size:16px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
.app{max-width:640px;margin:0 auto;padding:0 22px calc(96px + env(safe-area-inset-bottom));}
h2{font-family:var(--display);font-weight:400;margin:0}
input{font:inherit;color:inherit}
button{font:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:rgba(182,130,53,.3)}

.status{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:7px;
  padding:12px 0 10px;font-size:12.5px;color:var(--n600);border-bottom:1px solid var(--hair)}
.status svg{flex:none}
.kicker{font-family:"Lora",serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-700)}
.rule{height:1px;background:var(--divider)}
.sec{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-t{font-family:var(--display);font-size:17px;letter-spacing:.14em;color:var(--n800)}
.sec .rule{flex:1}
.sec-n{font-size:12.5px;color:var(--n600);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:24px;padding-top:14px}
.col{display:flex;flex-direction:column;gap:12px}
.muted{font-size:13px;line-height:1.8;color:var(--n600)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;letter-spacing:.1em;color:var(--n700)}
.input{width:100%;background:transparent;border:1px solid var(--divider);border-radius:4px;
  padding:0 14px;min-height:52px;font-family:var(--serif);font-size:17px}
.input:hover{border-color:var(--accent-400)}
.input:focus-visible{border-color:var(--accent)}
.bare{border:none;border-radius:0;padding:0;background:transparent;min-height:40px}
.underline{border-bottom:1px solid rgba(32,31,29,.28)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  font-family:var(--serif);font-size:16px;background:transparent;border:1px solid transparent;
  border-radius:4px;min-height:52px;padding:0 18px;color:var(--text);width:100%}
.btn-primary{color:var(--accent-700);border-color:var(--accent)}
.btn-primary:hover{background:rgba(182,130,53,.12)}
.btn-primary:active{background:rgba(182,130,53,.22)}
.btn-secondary{border-color:var(--divider)}
.btn-secondary:hover{background:rgba(32,31,29,.06)}
.btn-ghost{color:var(--n800)}
.btn-ghost:hover{background:rgba(32,31,29,.05)}
.btn-inline{width:auto;justify-content:flex-start;padding-left:0;min-height:48px;font-size:15px}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

.box{border:1px solid var(--divider);border-radius:4px;padding:11px 12px;display:flex;align-items:center;gap:10px}
.box .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.box .tag{font-size:11px;letter-spacing:.1em;color:var(--n500)}
.amt{width:128px;flex:none;display:flex;flex-direction:column;gap:3px}
.amt .tag{text-align:right}
.amt-in{display:flex;align-items:center;gap:4px;border-bottom:1px solid rgba(32,31,29,.28)}
.amt-in span{font-family:var(--num);font-size:13px;color:var(--accent-700)}
.amt-in input{text-align:right;font-family:var(--num);font-size:18px;font-variant-numeric:tabular-nums}
.qty{width:66px;flex:none;display:flex;flex-direction:column;gap:3px}
.qty .tag{text-align:right}
.qty input{text-align:right;font-family:var(--num);font-size:18px;font-variant-numeric:tabular-nums;
  border-bottom:1px solid rgba(32,31,29,.28)}
.no{width:22px;flex:none;font-family:var(--num);font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.x{width:40px;height:48px;flex:none;border:none;background:transparent;cursor:pointer;color:var(--n400);
  display:flex;align-items:center;justify-content:center;border-radius:4px}
.x:hover{color:var(--accent-700);background:rgba(32,31,29,.05)}

.summary{border:1px solid var(--accent-400);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:13px}
.summary .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.summary .row span:first-child{font-size:15px;color:var(--n800)}
.big{font-family:var(--display);font-weight:500;font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.bigger{font-size:32px}
.neg{color:var(--danger)}
.tri{display:flex;gap:0;border:1px solid var(--accent-400);border-radius:4px;padding:18px}
.tri>div{flex:1;display:flex;flex-direction:column;gap:7px;padding-left:16px;border-left:1px solid rgba(32,31,29,.14)}
.tri>div:first-child{padding-left:0;border-left:none}
.tri .lbl{font-size:12.5px;color:var(--n700)}

.pick{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:48px;
  padding:14px 16px;border-radius:4px;cursor:pointer;background:transparent;border:1px solid var(--divider);width:100%;text-align:left}
.pick:hover{background:rgba(32,31,29,.04)}
.pick.on{border-color:var(--accent)}
.pick .nm{font-size:18px;font-weight:500}
.pick .mt{font-family:var(--num);font-size:12.5px;color:var(--n600);font-variant-numeric:tabular-nums;margin-top:4px}
.mark{width:22px;height:22px;border-radius:50%;flex:none;border:1px solid var(--n400)}
.pick.on .mark{border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 22px var(--accent)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair);min-height:48px}
.li .nm{font-size:17.5px;font-weight:500}
.li .mt{font-family:var(--num);font-size:12.5px;color:var(--n600);font-variant-numeric:tabular-nums;margin-top:4px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);
  border-top:1px solid var(--divider);padding:10px 6px calc(14px + env(safe-area-inset-bottom))}
.tabs .in{max-width:640px;margin:0 auto;display:flex;width:100%}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:52px;padding:6px 0;
  border:none;background:transparent;cursor:pointer;color:var(--n500);font-size:12px;letter-spacing:.06em}
.tab.on{color:var(--accent-700)}

.sheet{border:1px solid rgba(32,31,29,.22);background:var(--paper);padding:24px 20px;
  display:flex;flex-direction:column;gap:18px}
.sheet .hd{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.sheet .hd h3{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.06em;margin:0}
.sheet .hd .sub{font-size:13px;color:var(--n700);font-variant-numeric:tabular-nums}
.sheet .hd .dash{width:46px;height:1px;background:var(--accent);margin-top:4px}
.sheet .grp{display:flex;flex-direction:column;gap:8px}
.sheet .grp>.lbl{font-size:12.5px;letter-spacing:.14em;color:var(--accent-700)}
.sr{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:15px}
.sr.sum{border-bottom:none;padding-top:9px}
.sr.sum span:first-child{color:var(--n700)}
.sr.sum span:last-child{font-weight:500}
.total{border-top:1px solid rgba(32,31,29,.22);padding-top:14px;display:flex;justify-content:space-between;align-items:baseline}
.thead{display:flex;gap:10px;padding-bottom:7px;border-bottom:1px solid rgba(32,31,29,.22);
  font-size:11.5px;color:var(--accent-700);letter-spacing:.08em}
.trow{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--hair);font-size:14.5px}
.foot{font-size:11.5px;line-height:1.7;color:var(--n600);text-align:center}
.c-no{width:22px;flex:none;font-family:var(--num);font-size:12.5px;color:var(--accent);font-variant-numeric:tabular-nums}
.c-nm{width:76px;flex:none;font-weight:500}
.c-gr{flex:1;font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--n800)}
.c-id{flex:none;font-family:var(--num);font-variant-numeric:tabular-nums}
.c-r{width:56px;flex:none;text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}

.hidden{display:none !important}
#print-area{display:none}
@media print{
  body{background:#fff}
  .app,.tabs{display:none !important}
  #print-area{display:block !important;padding:0}
  #print-area .sheet{border:none;background:#fff;padding:0;gap:16px}
  .trow,.sr{break-inside:avoid}
  @page{margin:16mm}
}
@media (min-width:720px){
  .app{max-width:720px;padding-bottom:120px}
  .stack{gap:28px}
}
</style>
</head>
<body>

<div class="app">
  <div class="status">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b68235" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 16h5v5"></path></svg>
    <span id="saved">尚未變更</span>
  </div>
  <div id="view"></div>
</div>

<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="print-area"></div>

<script>
(function(){
"use strict";
var KEY = 'shengyi-ledger-v2';

var ICON = {
  trip:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  pudu:'<path d="M3 11h18"/><path d="M5 11a7 7 0 0 1 14 0"/><path d="M4 15h16"/><path d="M7 15v4"/><path d="M17 15v4"/><path d="M12 4v3"/>',
  roster:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>',
  past:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6"/><path d="M16 12h-6"/><path d="M13 16h-3"/>'
};
var X = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>';

var DEFAULT_COSTS = [
  {name:'油香',amount:600},{name:'花籃水果',amount:1200},{name:'金紙',amount:800},
  {name:'紅包',amount:600},{name:'午餐',amount:2000},{name:'車資',amount:9000},{name:'保險',amount:1600}
];

var ROSTER = [
  {name:'黃林玉葉',birth:'42.12.04',id:'P201876414'},
  {name:'黃益雄',birth:'65.12.11',id:'N123123553'},
  {name:'吳雅如',birth:'70.12.16',id:'N223859747'},
  {name:'鍾文龍',birth:'57.08.20',id:'N120471392'},
  {name:'黃美玲',birth:'59.05.02',id:'N220987511'},
  {name:'鍾雅涵',birth:'82.05.27',id:'N225184609'},
  {name:'邱顯富',birth:'83.03.25',id:'Q123089236'},
  {name:'邱煜翔',birth:'109.01.02',id:'N128155582'},
  {name:'邱妍忻',birth:'111.03.29',id:'N227903273'},
  {name:'黃秀春',birth:'53.07.02',id:'N221948787'},
  {name:'巫月桂',birth:'40.09.20',id:'N201215787'},
  {name:'張淑慧',birth:'66.04.28',id:'N225916647'},
  {name:'許翠娥',birth:'52.06.21',id:'N224988603'},
  {name:'陳盈利',birth:'56.03.07',id:'N221240455'},
  {name:'巫梅姿',birth:'48.10.15',id:'N221808019'},
  {name:'黃葦庭',birth:'92.03.18',id:'N226240160'},
  {name:'蘇威領',birth:'56.11.09',id:'N121469289'},
  {name:'黃雅玲',birth:'57.06.04',id:'N220407090'},
  {name:'徐金鑾',birth:'54.03.20',id:'N220945577'},
  {name:'龔秋菊',birth:'50.10.21',id:'Q220500785'},
  {name:'許明鄰',birth:'59.05.26',id:'N121754596'},
  {name:'黃麗孜',birth:'63.09.13',id:'N223006657'},
  {name:'許絨騏',birth:'88.02.10',id:'P223955370'},
  {name:'陳育銓',birth:'65.09.09',id:'N123190858'},
  {name:'楊英雯',birth:'65.08.30',id:'N222832591'},
  {name:'楊麗卿',birth:'46.10.15',id:'N220990269'},
  {name:'廖瑛席',birth:'78.07.30',id:'N125254828'},
  {name:'廖裴萱',birth:'81.10.09',id:'N225256842'},
  {name:'黃玉林',birth:'54.09.01',id:'N220950309'},
  {name:'羅文澤',birth:'57.09.22',id:'Q124567695'},
  {name:'許素卿',birth:'56.11.18',id:'N221721731'},
  {name:'羅阡毓',birth:'89.08.06',id:'P224540588'},
  {name:'陳美華',birth:'64.07.29',id:'N222956078'},
  {name:'陳俊雄',birth:'65.12.21',id:'N122962485'},
  {name:'林信女',birth:'46.03.07',id:'M220022836'},
  {name:'黃秀絨',birth:'45.01.20',id:'N221948769'},
  {name:'陳重翰',birth:'54.03.10',id:'N121210651'},
  {name:'林世勳',birth:'80.03.19',id:'N125327764'},
  {name:'劉芷瑄',birth:'',id:''},
  {name:'陳聖廷',birth:'',id:''},
  {name:'葉品均',birth:'',id:''},
  {name:'鍾立洋',birth:'',id:''},
  {name:'鍾立綸',birth:'',id:''}
];

function seed(){
  return {
    tab:'trip', screen:null, currentId:'t1',
    trips:[{
      id:'t1', place:'楓港一日進香', date:'115.06.17',
      costs:DEFAULT_COSTS.map(function(c){return {name:c.name,amount:c.amount};}),
      sponsors:[], going:[]
    }],
    roster:ROSTER.map(function(r){return {name:r.name,birth:r.birth,id:r.id};}), pudu:[]
  };
}

var S = load();

function load(){
  var base = seed();
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var d = JSON.parse(raw);
      if(d && d.trips && d.trips.length){
        base.trips = d.trips;
        base.currentId = d.currentId || d.trips[0].id;
      }
      if(d && d.roster && d.roster.length) base.roster = d.roster;
      // 補齊：舊資料裡沒有的人一律帶入，姓名相同者不重複
      var have = {};
      base.roster.forEach(function(r){ have[String(r.name).trim()] = r; });
      ROSTER.forEach(function(r){
        var cur = have[r.name];
        if(!cur){ base.roster.push({name:r.name,birth:r.birth,id:r.id}); have[r.name] = r; }
        else { if(!cur.birth && r.birth) cur.birth = r.birth; if(!cur.id && r.id) cur.id = r.id; }
      });
      if(d && d.pudu) base.pudu = d.pudu;
    }
  }catch(e){}
  return base;
}

function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({trips:S.trips, currentId:S.currentId, roster:S.roster, pudu:S.pudu}));
    var t = new Date();
    var hh = ('0'+t.getHours()).slice(-2), mm = ('0'+t.getMinutes()).slice(-2);
    document.getElementById('saved').textContent = '已自動儲存 ' + hh + ':' + mm;
  }catch(e){
    document.getElementById('saved').textContent = '無法儲存（瀏覽器阻擋）';
  }
}

function trip(){
  for(var i=0;i<S.trips.length;i++) if(S.trips[i].id===S.currentId) return S.trips[i];
  return S.trips[0];
}
function num(v){ var n = parseInt(String(v).replace(/[^0-9-]/g,''),10); return isNaN(n)?0:n; }
function fmt(n){ return (Number(n)||0).toLocaleString('en-US'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function income(t){ return t.sponsors.reduce(function(a,x){return a+num(x.amount);},0); }
function costTotal(t){ return t.costs.reduce(function(a,x){return a+num(x.amount);},0); }
function today(){
  var d = new Date();
  return (d.getFullYear()-1911) + '.' + ('0'+(d.getMonth()+1)).slice(-2) + '.' + ('0'+d.getDate()).slice(-2);
}
function goingPeople(t){
  return S.roster.filter(function(r){ return t.going.indexOf(r.name) > -1; });
}

/* ── render ───────────────────────────────────────────── */

function render(){
  var v = document.getElementById('view');
  var t = trip();
  if(S.screen === 'sheet') v.innerHTML = viewSheet(t);
  else if(S.screen === 'insure') v.innerHTML = viewInsure(t);
  else if(S.screen === 'pudusheet') v.innerHTML = viewPuduSheet();
  else if(S.tab === 'trip') v.innerHTML = viewTrip(t);
  else if(S.tab === 'pudu') v.innerHTML = viewPudu();
  else if(S.tab === 'roster') v.innerHTML = viewRoster();
  else v.innerHTML = viewPast();
  renderTabs();
  window.scrollTo(0,0);
}

function renderTabs(){
  var defs = [['trip','本次活動',ICON.trip],['pudu','普渡',ICON.pudu],['roster','名冊',ICON.roster],['past','歷次',ICON.past]];
  document.getElementById('tabs').innerHTML = defs.map(function(d){
    return '<button class="tab'+(S.tab===d[0]&&!S.screen?' on':'')+'" data-tab="'+d[0]+'">'
      + '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">'+d[2]+'</svg>'
      + '<span>'+d[1]+'</span></button>';
  }).join('');
}

function backBtn(){
  return '<button class="btn btn-ghost btn-inline" data-act="back">← 返回</button>';
}

function viewTrip(t){
  var inc = income(t), cost = costTotal(t), bal = inc - cost;
  var going = goingPeople(t);
  var h = '<div class="stack">';

  h += '<div class="col">'
    + '<div class="kicker">聖義堂 · 班長記帳</div>'
    + '<div class="field"><label>地點</label>'
    + '<input class="input" data-f="place" value="'+esc(t.place)+'" style="font-family:var(--display);font-size:27px;font-weight:500;min-height:56px"></div>'
    + '<div class="field"><label>日期</label>'
    + '<input class="input num" data-f="date" value="'+esc(t.date)+'"></div>'
    + '</div>';

  h += '<div class="summary">'
    + '<div class="row"><span>收款總額</span><span class="big">NT$'+fmt(inc)+'</span></div>'
    + '<div class="row"><span>支出總額</span><span class="num" style="font-size:20px">−'+fmt(cost)+'</span></div>'
    + '<div class="rule"></div>'
    + '<div class="row"><span style="color:var(--accent-700)">剩餘餘額</span>'
    + '<span class="big bigger'+(bal<0?' neg':'')+'">'+(bal<0?'−NT$':'NT$')+fmt(Math.abs(bal))+'</span></div>'
    + '</div>';

  h += '<div><div class="sec"><div class="sec-t">費用項目</div><div class="rule"></div><div class="sec-n">'+t.costs.length+' 項</div></div>'
    + '<div class="col">'
    + t.costs.map(function(c,i){
        return '<div class="box">'
          + '<div class="grow"><div class="tag">項目</div>'
          + '<input class="input bare" style="font-size:18px;font-weight:500" placeholder="項目名稱" data-list="costs" data-i="'+i+'" data-k="name" value="'+esc(c.name)+'"></div>'
          + '<div class="amt"><div class="tag">金額</div><div class="amt-in"><span>NT$</span>'
          + '<input class="input bare" placeholder="0" inputmode="numeric" data-list="costs" data-i="'+i+'" data-k="amount" value="'+esc(c.amount)+'"></div></div>'
          + '<button class="x" data-del="costs" data-i="'+i+'" aria-label="刪除">'+X+'</button></div>';

  h += '<div><div class="sec"><div class="sec-t">贊助名單</div><div class="rule"></div><div class="sec-n">'+t.sponsors.length+' 筆</div></div>'
    + '<div class="col">'
    + (t.sponsors.length ? t.sponsors.map(function(s,i){
        return '<div class="box"><div class="no">'+(i+1)+'</div>'
          + '<div class="grow"><div class="tag">姓名</div>'
          + '<input class="input bare" style="font-size:18px;font-weight:500" placeholder="姓名" data-list="sponsors" data-i="'+i+'" data-k="name" value="'+esc(s.name)+'"></div>'
          + '<div class="amt"><div class="tag">隨喜金額</div><div class="amt-in"><span>NT$</span>'
          + '<input class="input bare" placeholder="0" inputmode="numeric" data-list="sponsors" data-i="'+i+'" data-k="amount" value="'+esc(s.amount)+'"></div></div>'
          + '<button class="x" data-del="sponsors" data-i="'+i+'" aria-label="刪除">'+X+'</button></div>';
      }).join('') : '<div class="muted">還沒有人贊助，按下面新增。</div>')
    + '</div>'
    + '<button class="btn btn-primary" data-add="sponsors" style="margin-top:12px">＋ 新增贊助（姓名＋金額）</button></div>';

  h += '<div><div class="sec"><div class="sec-t">誰要去</div><div class="rule"></div><div class="sec-n">'+going.length+' / '+S.roster.length+' 位</div></div>'
    + '<div class="col">'
    + (S.roster.length ? S.roster.map(function(r){
        var on = t.going.indexOf(r.name) > -1;
        return '<button class="pick'+(on?' on':'')+'" data-go="'+esc(r.name)+'">'
          + '<span><span class="nm">'+esc(r.name)+'</span><br><span class="mt">'+esc(r.birth||'—')+' · '+esc(r.id||'—')+'</span></span>'
          + '<span class="mark"></span></button>';
      }).join('') : '<div class="muted">名冊還是空的。先到「名冊」分頁新增人員，這裡才能勾選誰要去。</div>')
    + '</div>'

  h += '<div class="col">'
    + '<button class="btn btn-secondary" data-act="sheet">匯出捐款表（列印檔）</button>'

    + (S.roster.length ? S.roster.map(function(r,i){

    + '<div class="muted">資料存在這台裝置的瀏覽器裡，關掉網頁不會消失。要換手機或搬到電腦，先「匯出備份檔」，把檔案傳過去再「匯入備份檔」。</div>'

    + S.pudu.map(function(p,i){
        return '<div class="trow"><div class="c-no">'+(i+1)+'</div><div style="flex:1;font-weight:500">'+esc(p.name||'—')+'</div>'

      }).join('')

/* ── events ───────────────────────────────────────────── */

function listOf(name){
  if(name === 'roster') return S.roster;
  if(name === 'pudu') return S.pudu;
  return trip()[name];
}

document.addEventListener('input', function(e){
  var el = e.target;
  if(el.dataset.f){ trip()[el.dataset.f] = el.value; save(); return; }
  if(el.dataset.list){
    listOf(el.dataset.list)[+el.dataset.i][el.dataset.k] = el.value;
    save();
    if(el.dataset.list === 'costs' || el.dataset.list === 'sponsors') refreshSummary();
    if(el.dataset.list === 'pudu') refreshPudu();
  }
});

function refreshSummary(){
  var box = document.querySelector('.summary');
  if(!box) return;
  var t = trip(), inc = income(t), cost = costTotal(t), bal = inc - cost;
  var rows = box.querySelectorAll('.row');
  rows[0].lastElementChild.textContent = 'NT$' + fmt(inc);
  rows[1].lastElementChild.textContent = '−' + fmt(cost);
  var b = rows[2].lastElementChild;
  b.textContent = (bal<0?'−NT$':'NT$') + fmt(Math.abs(bal));
  b.className = 'big bigger' + (bal<0?' neg':'');
}
function refreshPudu(){
  var tri = document.querySelector('.tri');
  if(!tri) return;
  var tables = S.pudu.reduce(function(a,x){return a+num(x.tables);},0);
  var rice = S.pudu.reduce(function(a,x){return a+num(x.rice);},0);
  var vals = tri.querySelectorAll('.big');
  vals[0].textContent = S.pudu.length;
  vals[1].textContent = tables;
  vals[2].textContent = rice + ' 包';
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-tab],[data-act],[data-add],[data-del],[data-go],[data-trip]');
  if(!el) return;

  if(el.dataset.tab){ S.tab = el.dataset.tab; S.screen = null; return render(); }

  if(el.dataset.go !== undefined){
    var t = trip(), n = el.dataset.go, k = t.going.indexOf(n);
    if(k > -1) t.going.splice(k,1); else t.going.push(n);
    save(); return render();
  }

  if(el.dataset.trip){ S.currentId = el.dataset.trip; S.tab = 'trip'; S.screen = null; save(); return render(); }

  if(el.dataset.add){
    var nm = el.dataset.add;
    if(nm === 'costs') trip().costs.push({name:'',amount:''});
    else if(nm === 'sponsors') trip().sponsors.push({name:'',amount:''});
    else if(nm === 'roster') S.roster.push({name:'',birth:'',id:''});
    else if(nm === 'pudu') S.pudu.push({name:'',tables:'',rice:''});
    save(); render();
    var boxes = document.querySelectorAll('.box');
    if(boxes.length){
      var last = boxes[boxes.length-1].querySelector('input');
      if(last) last.focus();
    }
    return;
  }

  if(el.dataset.del){ listOf(el.dataset.del).splice(+el.dataset.i,1); save(); return render(); }

  var a = el.dataset.act;
  if(a === 'back'){ S.screen = null; return render(); }
  if(a === 'sheet'){ S.screen = 'sheet'; return render(); }
  if(a === 'insure'){ S.screen = 'insure'; return render(); }
  if(a === 'pudusheet'){ S.screen = 'pudusheet'; return render(); }
  if(a === 'toroster'){ S.tab = 'roster'; S.screen = null; return render(); }

  if(a === 'fillroster'){
    var have2 = {};
    S.roster.forEach(function(r){ have2[String(r.name).trim()] = r; });
    ROSTER.forEach(function(r){
      var cur = have2[r.name];
      if(!cur){ S.roster.push({name:r.name,birth:r.birth,id:r.id}); have2[r.name] = r; }
      else { if(!cur.birth && r.birth) cur.birth = r.birth; if(!cur.id && r.id) cur.id = r.id; }
    });
    save(); return render();
  }

  if(a === 'dedupe'){
    var seen = {}, out = [];
    S.roster.forEach(function(r){
      var k = String(r.name).trim();
      if(!k){ return; }
      if(seen[k]){
        var p = seen[k];
        if(!p.birth && r.birth) p.birth = r.birth;
        if(!p.id && r.id) p.id = r.id;
        return;
      }
      seen[k] = r; out.push(r);
    });
    S.roster = out; save(); return render();
  }

  if(a === 'newtrip'){
    var id = 't' + Date.now();
    S.trips.unshift({id:id, place:'', date:today(),
      costs:DEFAULT_COSTS.map(function(c){return {name:c.name,amount:c.amount};}),
      sponsors:[], going:[]});
    S.currentId = id; S.tab = 'trip'; S.screen = null; save(); return render();
  }

  if(a === 'print'){
    var sheet = document.querySelector('#view .sheet');
    if(sheet){
      document.getElementById('print-area').innerHTML = sheet.outerHTML;
      window.print();
    }
    return;
  }

  if(a === 'export'){
    var data = JSON.stringify({v:2, trips:S.trips, roster:S.roster, pudu:S.pudu}, null, 2);
    var url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
    var link = document.createElement('a');
    link.href = url;
    link.download = '聖義堂記帳備份-' + today().replace(/\./g,'') + '.json';
    link.click();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    return;
  }
});

document.addEventListener('change', function(e){
  if(e.target.id !== 'importer') return;
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var d = JSON.parse(String(reader.result));
      if(d.trips && d.trips.length){ S.trips = d.trips; S.currentId = d.trips[0].id; }
      if(d.roster) S.roster = d.roster;
      if(d.pudu) S.pudu = d.pudu;
      save(); render();
    }catch(err){
      var m = document.getElementById('importmsg');
      if(m){ m.textContent = '檔案讀不到內容，請確認是本 App 匯出的備份檔。'; m.style.color = 'var(--danger)'; }
    }
  };
  reader.readAsText(file);
});

render();
})();
</script>
